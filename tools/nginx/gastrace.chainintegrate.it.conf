# gastrace.chainintegrate.it: the GasTrace admin page (admin/www) and the relayer (/gcr/, 127.0.0.1:8789).
# /etc/nginx/sites-available/gastrace.chainintegrate.it, linked in sites-enabled. The web root is admin/www
# in the clone at /var/www/gas-cylinder-registry, so nothing else in the repository is served.
# The certificate comes first, from the port 80 block alone (DEPLOY.md); its renewal uses the same path.

server {
    listen 80;
    listen [::]:80;
    server_name gastrace.chainintegrate.it;
    location ^~ /.well-known/acme-challenge/ { root /var/www/gas-cylinder-registry/admin/www; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen … ssl http2" works from nginx 1.9.5 (the server runs 1.18); "http2 on;" exists only from 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gastrace.chainintegrate.it;

    ssl_certificate     /etc/letsencrypt/live/gastrace.chainintegrate.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gastrace.chainintegrate.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/gas-cylinder-registry/admin/www;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/gastrace-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\. { return 404; }

    # The page and its script: always checked again, so a fix reaches every owner at once.
    location ~ \.(html|js|css)$ {
        include /etc/nginx/snippets/gastrace-security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The relayer (relayer/relay.js), on this machine only. 8787, 8788, 8811: Cross_Chain's relayer and
    # sponsor service, up-onboarding's creation service.
    location /gcr/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        client_max_body_size 700k;
        proxy_read_timeout 120s;
    }
}
