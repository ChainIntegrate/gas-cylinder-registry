# Response headers of gastrace.chainintegrate.it (nginx): /etc/nginx/snippets/gastrace-security-headers.conf.
# Included in the server block and again in every location with its own add_header (nginx drops the
# server-level headers there). The page is never framed; its scripts are its own; it connects only to
# LUKSO's public RPC and to this site's relayer (/gcr/).
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://rpc.mainnet.lukso.network; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Robots-Tag "noindex" always;
