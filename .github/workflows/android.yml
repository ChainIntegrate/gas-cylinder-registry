name: Android APK

# Two jobs (external review G-06). "test" runs every test and builds the APK unsigned, with no secret
# and read-only access: the ~1,150 npm packages, Playwright and the local chain run there and never see
# the release key. "release" runs only for a published release, in the protected "release" environment
# (Settings > Environments: required reviewers): it installs nothing, signs the APK built by "test" with
# the release key and attaches it to the release. Actions are pinned by commit.

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The ChainIntegrate Account extension's release whose catalog the admin page test checks against.
  UPONBOARDING_REF: extension-v0.6.0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      # Contracts, shared library, owner tools, relayer and the app's logic, on a local chain.
      - name: Tests
        timeout-minutes: 10
        run: npx hardhat test

      # The app's interface in Chromium against a local chain and the relayer (the demo, step by step).
      - name: Interface test
        timeout-minutes: 15
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          npm install --no-save playwright@1.56.1
          npx hardhat node > hardhat-node.log 2>&1 &
          sleep 8
          node scripts/ui-demo.js

      # The GasTrace admin page in Chromium, every request checked against the catalog of a released
      # ChainIntegrate Account extension (the public up-onboarding repository, at UPONBOARDING_REF).
      - name: Admin page test
        timeout-minutes: 10
        run: |
          git clone --depth 1 --branch "$UPONBOARDING_REF" https://github.com/ChainIntegrate/up-onboarding ../up-onboarding
          UPONBOARDING_DIR=../up-onboarding node scripts/admin-demo.js

      # The operator page: ChainIntegrate creates a register from the browser.
      - name: Operator page test
        timeout-minutes: 10
        run: node scripts/operator-demo.js

      - name: Web content and copy into the Android project
        run: |
          node scripts/build-app.js
          npx cap sync android

      # The phone key's signatures (Secp256k1.java) against vectors made with ethers.
      - name: Java unit tests
        working-directory: android
        timeout-minutes: 10
        run: ./gradlew testDebugUnitTest --no-daemon

      # The release build unsigned (signed in the "release" job), and a debug build to try on a phone.
      - name: Build the APKs
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Name the APKs after the commit
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/gastrace-${GITHUB_SHA::7}-unsigned.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/gastrace-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gastrace-apk
          path: out/gastrace-*.apk
          retention-days: 30

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # to attach the APK to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: android/app/build.gradle
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gastrace-apk

      # The release key comes from the secrets (GCR_KEYSTORE_B64: the PKCS#12 file in base64;
      # GCR_KEYSTORE_PASSWORD; optional GCR_KEY_ALIAS, default "gascylinders"). Nothing else runs here:
      # the Android SDK's own zipalign and apksigner, already on the runner.
      - name: Sign with the release key
        env:
          KEY_B64: ${{ secrets.GCR_KEYSTORE_B64 }}
          GCR_KEYSTORE_PASSWORD: ${{ secrets.GCR_KEYSTORE_PASSWORD }}
          GCR_KEY_ALIAS: ${{ secrets.GCR_KEY_ALIAS }}
        run: |
          version=$(grep -m1 'versionName' android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"; exit 1; fi
          if [ -z "$KEY_B64" ]; then echo "::error::no release key in the secrets"; exit 1; fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          umask 077
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/gascylinders.p12"
          unsigned=$(ls gastrace-*-unsigned.apk)
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/gascylinders.p12" --ks-type PKCS12 \
            --ks-key-alias "${GCR_KEY_ALIAS:-gascylinders}" --ks-pass env:GCR_KEYSTORE_PASSWORD --key-pass env:GCR_KEYSTORE_PASSWORD \
            --out "gastrace-$GITHUB_REF_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/gascylinders.p12"
          certs=$("$tools/apksigner" verify --print-certs "gastrace-$GITHUB_REF_NAME.apk")
          fp=$(echo "$certs" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: //')
          owner=$(echo "$certs" | grep -m1 'certificate DN' | sed 's/.*DN: //')
          echo "::notice title=Release key::gastrace-$GITHUB_REF_NAME.apk signed by $owner, SHA-256 $fp"

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/gascylinders.p12"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "gastrace-$GITHUB_REF_NAME.apk" --clobber --repo "$GITHUB_REPOSITORY"
